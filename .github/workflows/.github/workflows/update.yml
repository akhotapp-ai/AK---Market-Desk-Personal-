name: Update market data
on:
  schedule:
    - cron: "30 3 * * 1-5"
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python fetch_data.py
      - name: Commit changes
        run: |
          git config user.name "market-desk-bot"
          git config user.email "market-desk-bot@users.noreply.github.com"
          git add data/prices.json
          git diff --staged --quiet || (git commit -m "Update market data" && git push)
